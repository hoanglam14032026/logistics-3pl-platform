[project]
name = "logistics-3pl-platform"
version = "1.1.0"
description = "Nền tảng vận hành và đào tạo nghiệp vụ Logistics 3PL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Phụ thuộc chạy – chốt cứng (đặc tả 07 §2). Phụ thuộc bắc cầu khóa trong requirements-lock.txt.
dependencies = [
    "fastapi==0.162.2",
    "pydantic==2.14.3",
    "sqlalchemy==2.0.57",
    "alembic==1.20.1",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary]==3.3.8",
    "python-jose[cryptography]==3.5.0",
    "passlib[argon2]==1.7.4",
    "python-multipart==0.0.33",
]

[dependency-groups]
# Cài bằng: pip install -r requirements-lock.txt --group dev   (pip >= 25.1)
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
# Mã v1.1.0 đóng băng, gỡ sau Giai đoạn 2 (07 §3.3) – không lint.
extend-exclude = ["app/legacy_v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Header"]
