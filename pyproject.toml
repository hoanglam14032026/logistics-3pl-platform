[project]
name = "logistics-3pl-platform"
version = "1.1.0"
description = "Nền tảng vận hành và đào tạo nghiệp vụ Logistics 3PL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Phụ thuộc chạy – chốt cứng (đặc tả 07 §2). Phụ thuộc bắc cầu khóa trong requirements-lock.txt.
# JWT: PyJWT (HS256, không cần extra [crypto]); băm mật khẩu: argon2-cffi trực tiếp.
# cryptography (Giai đoạn 6, lý do bảo mật): mã hóa totp_secret bằng Fernet, khóa TOTP_ENCRYPTION_KEY.
# rq + redis (Giai đoạn 7): hàng đợi tác vụ nền bền vững (JOB_QUEUE_URL) – gửi email không mất khi tiến trình dừng.
# pypdfium2, pillow, python-docx, openpyxl (Giai đoạn 9 – AI local trích xuất chứng từ): chuyển pdf/ảnh/docx/xlsx
# thành ảnh + văn bản trước OCR. OCR mặc định: chương trình tesseract (vie+eng) của hệ điều hành, gọi qua tiến trình con.
dependencies = [
    "fastapi==0.162.2",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.0.57",
    "alembic==1.20.1",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary]==3.3.8",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.33",
    "cryptography==50.0.2",
    "rq==2.9.1",
    "redis==8.1.0",
    "pypdfium2==5.15.1",
    "pillow==13.0.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# OCR PaddleOCR (DOCAI_OCR_ENGINE=paddle) – tùy chọn: ~1 GB, ~57 gói bắc cầu, paddlex ghim PyYAML==6.0.2.
# Khóa riêng: requirements-ocr-paddle-lock.txt (cài sau requirements-lock.txt, lệnh riêng).
ocr-paddle = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]

[dependency-groups]
# Khóa cùng phụ thuộc chạy trong requirements-dev-lock.txt. Cài: pip install -r requirements-dev-lock.txt
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
# Mã v1.1.0 đóng băng, gỡ sau Giai đoạn 2 (07 §3.3) – không lint.
extend-exclude = ["app/legacy_v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Header"]
