# Giá trị mặc định chỉ dùng cho máy dev. Môi trường thật: đặt POSTGRES_PASSWORD, DATABASE_URL, JWT_SECRET,
# TOTP_ENCRYPTION_KEY qua file .env
# (mẫu: .env.example).
name: logistics-3pl-platform
services:
  db:
    image: postgres:17
    container_name: logistics-3pl-db
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics}
      POSTGRES_DB: logistics_3pl_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_3pl_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Hàng đợi tác vụ nền (Giai đoạn 7). AOF: tác vụ đã xếp không mất khi Redis khởi động lại.
  # CSDL số 15 dành cho test (TEST_JOB_QUEUE_URL) – bộ test xóa sạch CSDL đó.
  redis:
    image: redis:7.4-alpine
    container_name: logistics-3pl-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    image: logistics-3pl-platform:latest
    container_name: logistics-3pl-platform
    # Biến khác (SMTP_*, PUBLIC_BASE_URL, giới hạn tần suất…) đọc từ .env; khối environment dưới đây ghi đè.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:${POSTGRES_PASSWORD:-logistics}@db:5432/logistics_3pl_dev
      # Bắt buộc (06 §6), đặt trong .env; thiếu thì dịch vụ api dừng ngay khi khởi động.
      JWT_SECRET: ${JWT_SECRET:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      JOB_QUEUE_URL: redis://redis:6379/0
      # AI local (Giai đoạn 9): Ollama chạy trên máy chủ (ngoài compose). Chỉ localhost / mạng nội bộ – sai thì không chạy.
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Khớp UPLOAD_DIR mặc định ./data/uploads (06 §6); trong container là /app/data/uploads (Dockerfile).
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

  # Worker hàng đợi rq (gửi email, OCR + AI trích xuất chứng từ) – cùng image với api
  worker:
    image: logistics-3pl-platform:latest
    container_name: logistics-3pl-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:${POSTGRES_PASSWORD:-logistics}@db:5432/logistics_3pl_dev
      JWT_SECRET: ${JWT_SECRET:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      JOB_QUEUE_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Giai đoạn 9: tác vụ trích xuất đọc file chứng từ đã tải lên (cùng thư mục với api)
      - ./data/uploads:/app/data/uploads
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
