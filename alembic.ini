# Cấu hình Alembic (đặc tả 07 §1). URL CSDL KHÔNG ghi ở đây: migrations/env.py lấy DATABASE_URL từ
# app/core/config.py (biến môi trường / .env). Dùng: alembic upgrade head | alembic revision --autogenerate -m "..."
# Ứng dụng tự chạy upgrade head khi khởi động (lifespan của create_app()).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Tên file: 0002_them_bang_x.py – đặt --rev-id 0002 khi tạo revision để giữ thứ tự dễ đọc.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
